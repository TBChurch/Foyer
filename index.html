<!-- Application Script -->
    <script>
        class RollingSignageApp {
            constructor() {
                this.state = {
                    slides: [],
                    ticker: {
                        text: "Welcome to Thornbury Baptist Church. Sunday Services: 9am in Oasis Room and 10:30am in main church.",
                        enabled: true
                    },
                    settings: {
                        defaultDuration: 10,
                        transition: "fade"
                    }
                };
                
                // Hardcoded JSONBin Credentials
                this.cloudBinUrl = "https://api.jsonbin.io/v3/b/6abb9d43ac6210605a018507";
                this.cloudApiKey = "$2a$10$Lw57fEK4TwqdOnZxAFHesuTWoC88So5ffCXBB55ccpto9Kl/Eksmu";
                
                this.currentSlideIndex = 0;
                this.slideTimer = null;
                this.isTVMode = false;
                this.pollInterval = null;

                this.loadLocal();
                this.initListeners();

                if (this.cloudBinUrl) {
                    this.pullFromCloud(true);
                    this.pollInterval = setInterval(() => this.pullFromCloud(true), 10000);
                }
            }

            async pushToCloud() {
                if (!this.cloudBinUrl) return;
                try {
                    const headers = { "Content-Type": "application/json" };
                    if (this.cloudApiKey) headers["X-Master-Key"] = this.cloudApiKey;

                    const response = await fetch(this.cloudBinUrl, {
                        method: "PUT",
                        headers: headers,
                        body: JSON.stringify(this.state)
                    });
                    if (response.ok) {
                        const statusEl = document.getElementById('sync-status');
                        if (statusEl) {
                            statusEl.className = "badge-sync badge-synced";
                            statusEl.innerText = "Cloud Sync Active (Synced)";
                        }
                    }
                } catch (e) {
                    console.warn("Cloud push deferred:", e);
                }
            }

            async pullFromCloud(silent = false) {
                if (!this.cloudBinUrl) return;
                try {
                    const headers = {};
                    if (this.cloudApiKey) headers["X-Master-Key"] = this.cloudApiKey;

                    const response = await fetch(this.cloudBinUrl, { method: "GET", headers: headers });
                    if (response.ok) {
                        const data = await response.json();
                        const remoteState = data.record || data;
                        if (remoteState && remoteState.slides) {
                            // Only update if remote has slides to prevent overwriting active local drops
                            this.state.slides = remoteState.slides || this.state.slides;
                            if (remoteState.ticker) this.state.ticker = remoteState.ticker;
                            if (remoteState.settings) this.state.settings = remoteState.settings;
                            
                            this.renderAdmin();
                            if (this.isTVMode) this.renderTVFrame();
                            const statusEl = document.getElementById('sync-status');
                            if (statusEl) {
                                statusEl.className = "badge-sync badge-synced";
                                statusEl.innerText = "Cloud Sync Active";
                            }
                        }
                    }
                } catch (e) {
                    if (!silent) console.warn("Cloud pull skipped:", e);
                }
            }

            saveLocal() {
                try {
                    localStorage.setItem('rolling_signage_state', JSON.stringify(this.state));
                } catch (e) {
                    console.warn("Local storage limit reached (images too large for localStorage). State kept in memory.", e);
                }
            }

            loadLocal() {
                try {
                    const saved = localStorage.getItem('rolling_signage_state');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        if (parsed && parsed.slides) {
                            this.state.slides = parsed.slides || [];
                            if (parsed.ticker) this.state.ticker = parsed.ticker;
                            if (parsed.settings) this.state.settings = parsed.settings;
                        }
                    }
                } catch (e) {
                    console.warn("Could not load local state:", e);
                }
                this.renderAdmin();
            }

            saveState() {
                this.saveLocal();
                this.pushToCloud();
            }

            initListeners() {
                const dropzone = document.getElementById('dropzone');
                const fileInput = document.getElementById('file-input');

                if (dropzone && fileInput) {
                    dropzone.addEventListener('click', () => fileInput.click());
                    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.style.borderColor = '#3b82f6'; dropzone.style.backgroundColor = '#111827'; });
                    dropzone.addEventListener('dragleave', () => { dropzone.style.borderColor = '#374151'; dropzone.style.backgroundColor = 'rgba(17, 24, 39, 0.5)'; });
                    dropzone.addEventListener('drop', (e) => {
                        e.preventDefault();
                        dropzone.style.borderColor = '#374151';
                        dropzone.style.backgroundColor = 'rgba(17, 24, 39, 0.5)';
                        if (e.dataTransfer.files.length) {
                            this.handleFiles(e.dataTransfer.files);
                        }
                    });

                    fileInput.addEventListener('change', (e) => {
                        if (e.target.files.length) {
                            this.handleFiles(e.target.files);
                        }
                    });
                }

                const bindClick = (id, handler) => {
                    const el = document.getElementById(id);
                    if (el) el.addEventListener('click', handler);
                };

                const bindChange = (id, handler) => {
                    const el = document.getElementById(id);
                    if (el) el.addEventListener('change', handler);
                };

                const bindInput = (id, handler) => {
                    const el = document.getElementById(id);
                    if (el) el.addEventListener('input', handler);
                };

                bindClick('btn-launch-tv', () => this.launchTVMode());
                bindClick('btn-exit-tv', () => this.exitTVMode());
                bindClick('btn-add-text', () => this.addTextSlide());
                bindClick('btn-export', () => this.exportJSON());
                bindChange('import-json', (e) => this.importJSON(e));

                bindInput('ticker-text', () => this.updateTickerSettings());
                bindChange('ticker-enabled', () => this.updateTickerSettings());
                bindChange('global-duration', () => this.updateGlobalSettings());
                bindChange('global-transition', () => this.updateGlobalSettings());
            }

            handleFiles(files) {
                Array.from(files).forEach(file => {
                    const reader = new FileReader();
                    const isVideo = file.type.startsWith('video/');
                    reader.onload = (e) => {
                        this.state.slides.push({
                            id: 'slide_' + Math.random().toString(36).substring(2),
                            type: isVideo ? 'video' : 'image',
                            url: e.target.result,
                            name: file.name,
                            fit: 'contain',
                            duration: this.state.settings.defaultDuration
                        });
                        this.renderAdmin();
                        this.saveState();
                    };
                    reader.readAsDataURL(file);
                });
            }

            addTextSlide() {
                this.state.slides.push({
                    id: 'slide_' + Math.random().toString(36).substring(2),
                    type: 'text',
                    title: 'Welcome!',
                    content: 'Add your announcements and custom text here.',
                    fit: 'contain',
                    duration: this.state.settings.defaultDuration
                });
                this.renderAdmin();
                this.saveState();
            }

            deleteSlide(id) {
                this.state.slides = this.state.slides.filter(s => s.id !== id);
                this.renderAdmin();
                this.saveState();
            }

            updateSlideField(id, field, val) {
                const slide = this.state.slides.find(s => s.id === id);
                if (slide) {
                    slide[field] = val;
                    this.saveState();
                }
            }

            updateTickerSettings() {
                const textEl = document.getElementById('ticker-text');
                const enabledEl = document.getElementById('ticker-enabled');
                if (textEl && enabledEl) {
                    this.state.ticker.text = textEl.value;
                    this.state.ticker.enabled = enabledEl.checked;
                    this.saveState();
                }
            }

            updateGlobalSettings() {
                const durationEl = document.getElementById('global-duration');
                const transitionEl = document.getElementById('global-transition');
                if (durationEl && transitionEl) {
                    this.state.settings.defaultDuration = parseInt(durationEl.value) || 10;
                    this.state.settings.transition = transitionEl.value;
                    this.saveState();
                }
            }

            renderAdmin() {
                const countEl = document.getElementById('slide-count');
                if (countEl) countEl.innerText = this.state.slides.length;
                
                const tickerTextEl = document.getElementById('ticker-text');
                if (tickerTextEl && document.activeElement !== tickerTextEl) tickerTextEl.value = this.state.ticker.text;

                const tickerEnabledEl = document.getElementById('ticker-enabled');
                if (tickerEnabledEl) tickerEnabledEl.checked = this.state.ticker.enabled;

                const globalDurationEl = document.getElementById('global-duration');
                if (globalDurationEl) globalDurationEl.value = this.state.settings.defaultDuration;

                const globalTransitionEl = document.getElementById('global-transition');
                if (globalTransitionEl) globalTransitionEl.value = this.state.settings.transition || 'fade';

                const list = document.getElementById('slides-list');
                if (!list) return;

                if (this.state.slides.length === 0) {
                    list.innerHTML = `<div style="text-align: center; padding: 3rem 0; color: #6b7280; border: 1px solid #1f2937; border-radius: 0.75rem; background-color: rgba(17, 24, 39, 0.3);">No slides added yet. Drag & drop files above or add a text slide to get started!</div>`;
                    return;
                }

                list.innerHTML = this.state.slides.map((slide, idx) => `
                    <div class="slide-item">
                        <div style="display: flex; align-items: center; gap: 0.75rem; width: auto;">
                            <span style="font-size: 0.75rem; font-family: monospace; color: #6b7280;">#${idx + 1}</span>
                            <div style="width: 4rem; height: 3rem; background-color: #030712; border-radius: 0.5rem; border: 1px solid #1f2937; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                                ${slide.type === 'image' ? `<img src="${slide.url}" style="width: 100%; height: 100%; object-fit: cover;">` : 
                                  slide.type === 'video' ? `<span style="font-size: 0.75rem; color: #60a5fa; font-weight: bold;">MP4</span>` : 
                                  `<span style="font-size: 0.75rem; color: #fbbf24; font-weight: bold;">TXT</span>`}
                            </div>
                            <div style="min-width: 0; flex: 1;">
                                <p style="font-size: 0.875rem; font-weight: 500; color: #e5e7eb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px;">${slide.name || slide.title || 'Slide ' + (idx + 1)}</p>
                                <p style="font-size: 0.75rem; color: #9ca3af; text-transform: capitalize;">${slide.type} slide</p>
                            </div>
                        </div>
                        <div style="display: flex; align-items: center; gap: 0.75rem; width: auto; justify-content: flex-end;">
                            <div style="display: flex; align-items: center; gap: 0.375rem;">
                                <span style="font-size: 0.75rem; color: #9ca3af;">Secs:</span>
                                <input type="number" min="2" max="120" value="${slide.duration || 10}" onchange="app.updateSlideField('${slide.id}', 'duration', parseInt(this.value))" style="width: 4rem; background-color: #030712; border: 1px solid #1f2937; border-radius: 0.5rem; padding: 0.25rem 0.5rem; font-size: 0.75rem; color: #e5e7eb;">
                            </div>
                            <div style="display: flex; align-items: center; gap: 0.375rem;">
                                <span style="font-size: 0.75rem; color: #9ca3af;">Fit:</span>
                                <select onchange="app.updateSlideField('${slide.id}', 'fit', this.value)" style="background-color: #030712; border: 1px solid #1f2937; border-radius: 0.5rem; padding: 0.25rem 0.5rem; font-size: 0.75rem; color: #e5e7eb;">
                                    <option value="contain" ${slide.fit === 'contain' ? 'selected' : ''}>Contain</option>
                                    <option value="cover" ${slide.fit === 'cover' ? 'selected' : ''}>Cover</option>
                                </select>
                            </div>
                            <button onclick="app.deleteSlide('${slide.id}')" style="background: none; border: none; cursor: pointer; color: #6b7280; padding: 0.375rem;" title="Delete slide">
                                🗑️
                            </button>
                        </div>
                    </div>
                `).join('');
            }

            exportJSON() {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(this.state, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", "signage_playlist.json");
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            }

            importJSON(event) {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const parsed = JSON.parse(e.target.result);
                        if (parsed && parsed.slides) {
                            this.state = parsed;
                            this.renderAdmin();
                            this.saveState();
                            alert("Playlist imported successfully!");
                        }
                    } catch (err) {
                        alert("Invalid JSON file format.");
                    }
                };
                reader.readAsText(file);
            }

            launchTVMode() {
                if (this.state.slides.length === 0) {
                    alert("Please add at least one slide before launching TV mode.");
                    return;
                }
                this.isTVMode = true;
                document.getElementById('admin-view').classList.add('hidden');
                document.getElementById('tv-display').classList.remove('hidden');
                
                try { document.documentElement.requestFullscreen(); } catch(e) {}

                this.currentSlideIndex = 0;
                this.renderTVFrame();
            }

            exitTVMode() {
                this.isTVMode = false;
                clearTimeout(this.slideTimer);
                document.getElementById('tv-display').classList.add('hidden');
                document.getElementById('admin-view').classList.remove('hidden');
                try { if (document.fullscreenElement) document.exitFullscreen(); } catch(e) {}
            }

            renderTVFrame() {
                if (!this.isTVMode) return;
                
                const tickerBar = document.getElementById('tv-ticker-bar');
                const tickerContent = document.getElementById('tv-ticker-content');
                if (this.state.ticker.enabled && this.state.ticker.text) {
                    tickerBar.classList.remove('hidden');
                    tickerContent.innerText = this.state.ticker.text;
                } else {
                    tickerBar.classList.add('hidden');
                }

                if (this.currentSlideIndex >= this.state.slides.length) {
                    this.currentSlideIndex = 0;
                }

                const slide = this.state.slides[this.currentSlideIndex];
                const stage = document.getElementById('tv-stage');
                
                if (!slide) {
                    stage.innerHTML = `<div style="color: white; font-size: 1.5rem;">No slides available</div>`;
                    return;
                }

                let contentHtml = '';
                const fitStyle = slide.fit === 'cover' ? 'width: 100%; height: 100%; object-fit: cover;' : 'max-width: 100%; max-height: 100%; object-fit: contain;';

                if (slide.type === 'image') {
                    contentHtml = `<img src="${slide.url}" style="${fitStyle}">`;
                } else if (slide.type === 'video') {
                    contentHtml = `<video src="${slide.url}" style="${fitStyle}" autoplay muted playsinline></video>`;
                } else if (slide.type === 'text') {
                    contentHtml = `
                        <div style="max-width: 56rem; padding: 3rem; text-align: center;">
                            <h2 style="font-size: 3rem; font-weight: 800; color: white; margin-bottom: 1.5rem; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">${slide.title || ''}</h2>
                            <p style="font-size: 1.875rem; color: #e5e7eb; line-height: 1.6; text-shadow: 0 1px 2px rgba(0,0,0,0.5);">${slide.content || ''}</p>
                        </div>
                    `;
                }

                const effect = (this.state.settings && this.state.settings.transition) || 'fade';
                let startClass = 'effect-fade-in';
                let activeClass = 'effect-fade-active';
                if (effect === 'zoom') {
                    startClass = 'effect-zoom-in';
                    activeClass = 'effect-zoom-active';
                } else if (effect === 'slide') {
                    startClass = 'effect-slide-in';
                    activeClass = 'effect-slide-active';
                } else if (effect === 'none') {
                    startClass = '';
                    activeClass = '';
                }

                stage.innerHTML = `<div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background-color: #000000 !important;" class="slide-transition ${startClass}">${contentHtml}</div>`;
                
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        const inner = stage.firstElementChild;
                        if (inner) inner.className = `slide-transition ${activeClass}`;
                        inner.style.cssText = "width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background-color: #000000 !important;";
                    });
                });

                const defDur = (this.state.settings && this.state.settings.defaultDuration) || 10;
                const duration = (slide.duration || defDur) * 1000;
                
                if (slide.type === 'video') {
                    const videoEl = stage.querySelector('video');
                    if (videoEl) {
                        videoEl.onended = () => {
                            this.currentSlideIndex++;
                            this.renderTVFrame();
                        };
                        this.slideTimer = setTimeout(() => {
                            this.currentSlideIndex++;
                            this.renderTVFrame();
                        }, Math.max(duration, 15000));
                    } else {
                        this.slideTimer = setTimeout(() => {
                            this.currentSlideIndex++;
                            this.renderTVFrame();
                        }, duration);
                    }
                } else {
                    this.slideTimer = setTimeout(() => {
                        this.currentSlideIndex++;
                        this.renderTVFrame();
                    }, duration);
                }
            }
        }

        let app;
        document.addEventListener('DOMContentLoaded', () => {
            app = new RollingSignageApp();
        });
    </script>
